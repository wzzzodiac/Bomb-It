<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111b30" />
    <title>Bomb-It</title>
  </head>
  <body>
    <main class="shell">
      <header class="hud"><div><h1>Bomb-It</h1><p>Clear the crates. Catch the rival in a blast.</p></div><div id="stats" aria-live="polite">Bombs 1 · Fire 2</div></header>
      <div id="game" aria-label="Bomb-It game arena"></div>
      <div class="controls" aria-label="Touch game controls">
        <div class="dpad">
          <button class="up" data-direction="up" aria-label="Move up">▲</button>
          <button class="left" data-direction="left" aria-label="Move left">◀</button>
          <button class="down" data-direction="down" aria-label="Move down">▼</button>
          <button class="right" data-direction="right" aria-label="Move right">▶</button>
        </div>
        <button class="bomb-button" id="bomb-button" aria-label="Place bomb">BOMB</button>
      </div>
      <p class="hint">WASD / arrows to move · Space to bomb</p>
      <div id="result" class="result hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <div class="result-card"><h2 id="result-title"></h2><button id="restart">Restart</button></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
