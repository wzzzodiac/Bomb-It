<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111b30" />
    <title>Bomb-It</title>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div><span class="eyebrow">ONE-ON-ONE ARCADE ARENA</span><h1><span class="title-mark">✦</span> Bomb-It</h1><p>Clear the crates. Catch the rival in a blast.</p></div>
        <span class="mode-pill"><span class="live-dot"></span> SOLO MATCH</span>
      </header>
      <div class="arena-top"><span class="arena-label">ARENA <strong>01</strong></span><div id="stats" class="stats" aria-live="polite">Bombs 1 · Fire 2</div></div>
      <div class="arena-frame"><div id="game" aria-label="Bomb-It game arena"></div></div>
      <div class="controls" aria-label="Touch game controls">
        <div class="dpad">
          <button class="up" data-direction="up" aria-label="Move up">▲</button>
          <button class="left" data-direction="left" aria-label="Move left">◀</button>
          <button class="down" data-direction="down" aria-label="Move down">▼</button>
          <button class="right" data-direction="right" aria-label="Move right">▶</button>
        </div>
        <button class="bomb-button" id="bomb-button" aria-label="Place bomb">BOMB</button>
      </div>
      <p class="hint"><span>CONTROLS</span> WASD / arrows to move <i>•</i> Space to bomb</p>
      <div id="result" class="result hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <div class="result-card"><span class="eyebrow">MATCH COMPLETE</span><h2 id="result-title"></h2><p>Ready for another round?</p><button id="restart">↻ &nbsp; Play again</button></div>
      </div>
    </main>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
